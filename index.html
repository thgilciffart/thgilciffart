<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>

            <button id="login-button">Login</button>
        </div>
    </div>
    <div id="main-content" class="container hidden">
        <button id="dark-mode-toggle" style="float:right; margin-bottom:10px; padding:6px 16px; border-radius:6px; border:none; background:#343a40; color:#fff; cursor:pointer; font-size:1em; font-family:inherit;">Toggle Dark Mode</button>
        <h1>HSC Mathematics Resources</h1>
        <input type="text" id="search-input" placeholder="Search for files and folders...">
        <div class="folder-structure" id="folder-structure">
            <p>Loading file structure...</p>
        </div>
        <div style='text-align:center; margin-top:30px; font-size:0.95em; color:#888;'>
            <a href='https://github.com/thgilciffart/thgilciffart.github.io' target='_blank' style='color:#888; text-decoration:underline;'>Visit the Github repository</a>
            <span style='margin:0 10px;'>|</span>
            <a href='https://github.com/thgilciffart/thgilciffart.github.io/blob/main/Resources.md' target='_blank' style='color:#888; text-decoration:underline;'>Further Resources</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const CORRECT_PASSWORD = 'maths2023'; // Hardcoded password (not secure for production)
            const loginContainer = document.getElementById('login-container');
            const mainContent = document.getElementById('main-content');
            const loginButton = document.getElementById('login-button');
            const passwordInput = document.getElementById('password-input');
            const errorMessage = document.getElementById('error-message');

            // Check if already authenticated
            if (localStorage.getItem('authenticated') === 'true') {
                loginContainer.classList.add('hidden');
                mainContent.classList.remove('hidden');
            }

            loginButton.addEventListener('click', () => {
                const enteredPassword = passwordInput.value;
                if (enteredPassword === CORRECT_PASSWORD) {
                    localStorage.setItem('authenticated', 'true');
                    loginContainer.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } else {
                    errorMessage.style.display = 'block';
                    passwordInput.value = '';
                }
            });

            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginButton.click();
                }
            });

            // Dark mode toggle
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const body = document.body;
            if (localStorage.getItem('darkMode') === 'enabled') {
                body.classList.add('dark-mode');
                darkModeToggle.textContent = 'Light Mode';
            }
            darkModeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('darkMode', 'enabled');
                    darkModeToggle.textContent = 'Light Mode';
                } else {
                    localStorage.setItem('darkMode', 'disabled');
                    darkModeToggle.textContent = 'Dark Mode';
                }
            });

            const folderStructure = document.getElementById('folder-structure');
            const repo = 'thgilciffart/thgilciffart.github.io';
            const apiUrl = `https://api.github.com/repos/${repo}/git/trees/main?recursive=1`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const fileTree = buildFileTree(data.tree);
                    folderStructure.innerHTML = generateHtml(fileTree);
                    attachEventListeners();
                })
                .catch(error => {
                    folderStructure.innerHTML = `<p>Error loading file structure. Please try again later.</p><p style="color:red;">${error.message}</p>`;
                    console.error('Error fetching from GitHub API:', error);
                });

            function buildFileTree(files) {
                const tree = {};
                const ignoredFiles = ['.gitignore', 'index.html', 'generate_index_html.ps1', 'LICENSE', 'README.md', 'Resources.md', 'Changelog.md'];
                files.forEach(file => {
                    if (file.type === 'blob' && !file.path.endsWith('.pdf')) {
                        return;
                    }
                    if (ignoredFiles.includes(file.path)) {
                        return;
                    }

                    const pathParts = file.path.split('/');
                    let currentLevel = tree;
                    pathParts.forEach((part, index) => {
                        if (!currentLevel[part]) {
                            currentLevel[part] = {};
                        }
                        if (index === pathParts.length - 1 && file.type === 'blob') {
                            currentLevel[part].type = 'file';
                            currentLevel[part].path = file.path;
                        } else {
                            if (!currentLevel[part].type) {
                                currentLevel[part].type = 'folder';
                            }
                        }
                        currentLevel = currentLevel[part];
                    });
                });
                return tree;
            }

            function generateHtml(node) {
                let html = '';
                const keys = Object.keys(node);
                const folders = keys.filter(key => node[key].type === 'folder').sort();
                const files = keys.filter(key => node[key].type === 'file').sort();
                const sortedKeys = folders.concat(files);

                for (const key of sortedKeys) {
                    const item = node[key];
                    if (item.type === 'folder') {
                        html += `<div class="folder">`;
                        html += `<div class="folder-name"><i class='fas fa-folder'></i> ${key}</div>`;
                        html += `<div class="folder-contents">`;
                        html += generateHtml(item);
                        html += `</div></div>`;
                    } else if (item.type === 'file') {
                        html += `<div class="file"><a href="${item.path}" target="_blank"><i class='fas fa-file-pdf'></i> ${key}</a></div>`;
                    }
                }
                return html;
            }

            function attachEventListeners() {
                folderStructure.addEventListener('click', event => {
                    const folderName = event.target.closest('.folder-name');
                    if (folderName) {
                        const folderContents = folderName.nextElementSibling;
                        if (folderContents && folderContents.classList.contains('folder-contents')) {
                            folderContents.style.display = folderContents.style.display === 'block' ? 'none' : 'block';
                            folderName.classList.toggle('open');
                        }
                    }
                });

                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('keyup', event => {
                    const searchTerm = event.target.value.toLowerCase();
                    const files = folderStructure.querySelectorAll('.file');
                    const folders = folderStructure.querySelectorAll('.folder');

                    files.forEach(file => {
                        const fileName = file.textContent.toLowerCase();
                        file.style.display = fileName.includes(searchTerm) ? 'block' : 'none';
                    });

                    folders.forEach(folder => {
                        const folderName = folder.querySelector('.folder-name').textContent.toLowerCase();
                        const visibleFiles = folder.querySelectorAll('.file[style*="display: block"]');
                        
                        if (folderName.includes(searchTerm) || visibleFiles.length > 0) {
                            folder.style.display = 'block';
                        } else {
                            folder.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
